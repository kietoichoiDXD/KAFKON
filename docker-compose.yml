version: '3.8'

services:
  kafkon-aiops:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/kietoichoidxd/kafkon:latest
    container_name: kafkon-aiops-studio
    ports:
      - "8000:8000"
    environment:
      - SCRIBEBA_MODE=live
      - PORT=8000
    env_file:
      - .env
    restart: unless-stopped
