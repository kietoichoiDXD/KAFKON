<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="title desc">
  <title id="title">ScribeBA AI to Backend Architecture Flow</title>
  <desc id="desc">React Studio, CLI, and channel adapters call the Flask API. The API routes to chat and analysis services, redacts data, calls the configured model fallback router, stores results, and exposes integrations through review-gated write paths.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1828"/><stop offset="1" stop-color="#08101c"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#14b8a6"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#35d6c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowWrite" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".25"/></filter>
    <style>
      .eyebrow{font:700 16px Inter,Segoe UI,Arial,sans-serif;letter-spacing:3px;fill:#5eead4}
      .title{font:750 55px Inter,Segoe UI,Arial,sans-serif;letter-spacing:-1.5px;fill:#f8fafc}
      .sub{font:400 22px Inter,Segoe UI,Arial,sans-serif;fill:#a7b7ca}
      .zone{font:700 14px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.8px;fill:#0f766e}
      .h{font:700 25px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .body{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .small{font:500 14px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}
      .pill{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#0f766e}
      .darkhead{font:700 21px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .darkbody{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#c4d2e1}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg2)"/>
  <circle cx="1690" cy="80" r="310" fill="#0f766e" opacity=".08"/><circle cx="170" cy="950" r="260" fill="#0369a1" opacity=".08"/>
  <text x="82" y="76" class="eyebrow">SCRIBEBA · BACKEND ARCHITECTURE</text>
  <text x="82" y="145" class="title">How AI moves through the backend</text>
  <text x="84" y="188" class="sub">Request in · protected context · routed inference · reviewed result out.</text>

  <g filter="url(#shadow2)">
    <rect x="78" y="250" width="340" height="310" rx="22" fill="#f8fafc"/>
    <rect x="475" y="250" width="360" height="310" rx="22" fill="#f8fafc"/>
    <rect x="892" y="250" width="430" height="310" rx="22" fill="#f8fafc"/>
    <rect x="1379" y="250" width="462" height="310" rx="22" fill="#f8fafc"/>
  </g>
  <path d="M418 404H465M835 404H882M1322 404H1369" stroke="#35d6c3" stroke-width="4" marker-end="url(#arrow2)"/>
  <g>
    <text x="110" y="291" class="zone">CLIENTS &amp; ADAPTERS</text><text x="110" y="340" class="h">Conversation starts</text>
    <text x="110" y="381" class="body">React + Vite Studio</text><text x="110" y="411" class="body">CLI and room chat</text><text x="110" y="441" class="body">Slack / Discord / Telegram</text><text x="110" y="471" class="body">Pasted thread or question</text>
    <rect x="110" y="496" width="274" height="36" rx="10" fill="#ecfeff"/><text x="126" y="519" class="pill">User intent + source link</text>
  </g>
  <g>
    <text x="507" y="291" class="zone">HTTP BOUNDARY</text><text x="507" y="340" class="h">Flask REST API</text>
    <text x="507" y="381" class="body">Session + origin checks</text><text x="507" y="411" class="body">Request validation + rate limits</text><text x="507" y="441" class="body">/api/chat · /api/analyze</text><text x="507" y="471" class="body">/api/slack-run · /api/ops/*</text>
    <rect x="507" y="496" width="294" height="36" rx="10" fill="#ecfeff"/><text x="523" y="519" class="pill">backend/api.py</text>
  </g>
  <g>
    <text x="924" y="291" class="zone">CORE ORCHESTRATION</text><text x="924" y="340" class="h">Prepare &amp; analyze</text>
    <text x="924" y="381" class="body">Parse speaker-attributed transcript</text><text x="924" y="411" class="body">Redact secrets and personal data</text><text x="924" y="441" class="body">Route intent + team-owned skill</text><text x="924" y="471" class="body">Analyzer · agents · validators</text>
    <rect x="924" y="496" width="356" height="36" rx="10" fill="#ecfeff"/><text x="940" y="519" class="pill">Protected context crosses the model boundary</text>
  </g>
  <g>
    <text x="1411" y="291" class="zone">INFERENCE ROUTER</text><text x="1411" y="340" class="h">Configured provider chain</text>
    <text x="1411" y="381" class="body">OpenRouter · Anthropic · Gemini</text><text x="1411" y="411" class="body">Nebius · OpenAI (when configured)</text><text x="1411" y="441" class="body">Tier controls the candidate order</text><text x="1411" y="471" class="body">Deterministic local fallback</text>
    <rect x="1411" y="496" width="390" height="36" rx="10" fill="#f0fdfa"/><text x="1427" y="519" class="pill">Provider trail is recorded with the run</text>
  </g>

  <path d="M1608 560V610H257V638M655 610V638M1050 610V638M1515 610V638" fill="none" stroke="#35d6c3" stroke-width="3" opacity=".75" marker-end="url(#arrow2)"/>
  <g filter="url(#shadow2)">
    <rect x="78" y="650" width="360" height="166" rx="20" fill="#122033" stroke="#244158"/>
    <rect x="475" y="650" width="360" height="166" rx="20" fill="#122033" stroke="#244158"/>
    <rect x="872" y="650" width="360" height="166" rx="20" fill="#122033" stroke="#244158"/>
    <rect x="1269" y="650" width="572" height="166" rx="20" fill="#122033" stroke="#244158"/>
  </g>
  <text x="108" y="694" class="darkhead">Structured result</text><text x="108" y="730" class="darkbody">Story · criteria · blockers</text><text x="108" y="762" class="darkbody">Evidence + readiness labels</text><text x="108" y="793" class="small">Return to Studio / channel</text>
  <text x="505" y="694" class="darkhead">Run record</text><text x="505" y="730" class="darkbody">Recent run history</text><text x="505" y="762" class="darkbody">SQLite / local file</text><text x="505" y="793" class="small">Optional cloud PostgreSQL</text>
  <text x="902" y="694" class="darkhead">Read integrations</text><text x="902" y="730" class="darkbody">Slack thread · Exa search</text><text x="902" y="762" class="darkbody">Prometheus · Kubernetes state</text><text x="902" y="793" class="small">Read access follows configured auth</text>
  <text x="1299" y="694" class="darkhead">Write integrations · gated</text><text x="1299" y="730" class="darkbody">Review → explicit approval → Slack / ClickUp sync</text><text x="1299" y="762" class="darkbody">Review diff + resourceVersion → Kubernetes apply</text><text x="1299" y="793" class="small">Stale proposal is rejected; no silent replay</text>

  <path d="M438 733H466M835 733H863M1232 733H1260" stroke="#35d6c3" stroke-width="3" marker-end="url(#arrow2)"/>
  <path d="M1550 816V870H655V828" fill="none" stroke="#fb923c" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrowWrite)"/>
  <rect x="510" y="882" width="900" height="100" rx="22" fill="#172b3d" stroke="#35d6c3" stroke-width="2"/>
  <text x="960" y="924" text-anchor="middle" style="font:700 21px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc">Review is the boundary between an AI proposal and an external write</text>
  <text x="960" y="955" text-anchor="middle" style="font:500 15px Inter,Segoe UI,Arial,sans-serif;fill:#b5c5d7">The app records a result first; integrations act only through an explicit, authorized path.</text>
  <text x="960" y="1030" text-anchor="middle" class="small">Architecture view · Flask API · analyzer + fallback router · local/cloud persistence · guarded integrations</text>
</svg>
