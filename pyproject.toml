[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scribeba"
version = "0.1.0"
description = "ScribeBA — AI Business Analyst Agent with Evidence Labeling & Multi-Platform MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "click>=8.1.7",
    "rich>=13.7.0",
]

[project.optional-dependencies]
live = [
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.27.0",
    "discord.py>=2.3.2",
]

[project.scripts]
scribeba = "src.cli:cli"
